<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>MediKiosk</title>
    <!-- The ground is black from the very first paint. Without this the browser
         shows one white frame before the stylesheet lands, which on a full-screen
         dark product is the most visible flash in the whole application. -->
    <style>
      html, body { margin: 0; background: #000; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
