# ABAC policy. Ported from SIH 25026 `config/policy.yaml` and re-scoped for clinical intake.
#
# The rules live here, not in Python, so a compliance reviewer can read the access model
# without reading code (ADR-0004, carried across). `app/auth/policy.py` only evaluates them.
#
# The important asymmetry: `patient` can write their own history but can never read another
# session, and `triage_nurse` can read red flags and queue position but NOT the clinical
# narrative — a triage desk needs to know someone is urgent, not why.

purposes:
  TREATMENT:
    candidates: allow
    curated_mappings: allow
    strip_identifiers: false
    aggregate_only: false
  CLAIM:
    candidates: deny          # a claim never carries an unreviewed candidate code
    curated_mappings: require_flag
    strip_identifiers: false
    aggregate_only: false
  RESEARCH:
    candidates: allow
    curated_mappings: allow
    strip_identifiers: true
    aggregate_only: false
  STATISTICS:
    candidates: allow
    curated_mappings: allow
    strip_identifiers: true
    aggregate_only: true

roles:
  anonymous:
    purposes: [TREATMENT]
    actions:
      - terminology.search
      - system.about

  patient:
    purposes: [TREATMENT]
    actions:
      - session.create
      - session.read_own
      - consent.grant
      - consent.revoke
      - dialogue.answer
      - document.upload
      # The patient reads back what OCR found on their OWN paper before it counts.
      # Deliberately NOT `document.verify`: that is the physician's action over any
      # session, this one only ever reaches a document in a session the caller owns,
      # and `load_context()` is what proves the ownership.
      - document.verify_own
      # Reads back the rendered page of a document in a session the caller OWNS. The
      # verification lane shows the patient the patch of their own paper each reading came
      # from — without it they are asked "is this right?" with no evidence to check against.
      # Deliberately NOT `document.read`, which is the clinician's action over ANY session
      # and carries no ownership constraint; `load_context()` proves ownership for this one.
      - document.read_own
      # The patient may read their OWN brief, in the patient-facing grouping. `_resolve()`
      # matches the token's abha_ref against the record before anything is assembled, so this
      # cannot reach another person's history. Deliberately NOT `session.read`, which is the
      # clinician's action over any patient and carries no ownership constraint.
      - report.read_own
      - session.submit
      - system.about

  clinician:
    purposes: [TREATMENT, CLAIM, RESEARCH]
    actions:
      - session.read
      - summary.generate
      - summary.read
      - summary.edit
      - summary.commit          # Invariant 4: only this role holds the commit action
      - fact.read
      - document.read
      - document.verify
      - document.verify_own       # a clinician may act on the patient-side lane too
      - queue.read
      - terminology.search
      - audit.read
      - system.about

  triage_nurse:
    purposes: [TREATMENT]
    actions:
      - queue.read
      - redflag.read            # deliberately NOT summary.read
      - system.about

  auditor:
    purposes: [RESEARCH, STATISTICS]
    actions:
      - audit.read
      - audit.verify
      - system.about
