[project]
name = "medikiosk"
version = "0.7.0"
description = "MediKiosk — patient-facing clinical intake platform (SIH26047, AIIA / Ministry of Ayush)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions/*", ".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The fixture generators hold verbatim patient utterances and rendered document lines as
# single string literals. Wrapping them with implicit concatenation is how a missing space
# gets into a gold expectation, and a gold set with a typo in it is worse than a long line.
"scripts/make_eval_scripts.py" = ["E501"]
"scripts/make_holdout_scripts.py" = ["E501"]
"scripts/make_document_fixtures.py" = ["E501"]

# The two journey smoke scripts are linear PROBES, not maintained modules: each line is one
# step of the patient/clinician walk, and they are read as a transcript of what was exercised.
# Compact `if x: print(...)` steps and long assertion messages are what make them readable in
# that role. The substantive checks (ambiguous names, unused variables) are fixed, not ignored.
"scripts/smoke_patient_journey.py" = ["E501", "E701", "E702", "E402"]
"scripts/smoke_clinician_journey.py" = ["E501", "E701", "E702", "E402"]

# Sharing a pytest fixture between test modules means importing it by name and then naming a
# test parameter after it — which ruff reads as a redefinition. The alternative is either
# duplicating the whole app-client fixture or moving it out of the end-to-end suite that owns
# it, and neither is worth a false positive. The import is real and the fixture is used.
"tests/test_whisper_stt.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/", "^frontend/", "^\\.venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::jwt.warnings.InsecureKeyLengthWarning",
]
