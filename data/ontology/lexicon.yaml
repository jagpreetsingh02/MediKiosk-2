# Phrase → option-value lexicon for the offline extractor. CONTENT, so it lives in data.
#
# This is the low-literacy phrasing layer: what a patient actually says, as opposed to the
# clinical label on the button. "chhaati mein bhaari lagta hai" is how someone describes
# pressure; "Heavy, like pressure" is how the button reads. Both must land on the same slot.
#
# Every phrase here is matched as a literal substring and the matched slice becomes the
# provenance quote, so nothing in this file can cause an unsourced fact.

